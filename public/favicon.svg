<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!--
    A tessera: one tile in a mosaic. Four surrounding tiles sit dark and slightly
    cropped, so the lit one reads as part of a larger picture rather than a lone square.
    Colours are the app's own brass on its warm near-black ground.
  -->
  <rect width="64" height="64" rx="12" fill="#16130F"/>
  <g fill="#2E2820">
    <rect x="7" y="7" width="18" height="18" rx="3"/>
    <rect x="39" y="7" width="18" height="18" rx="3"/>
    <rect x="7" y="39" width="18" height="18" rx="3"/>
    <rect x="39" y="39" width="18" height="18" rx="3"/>
    <rect x="28" y="4" width="8" height="8" rx="2"/>
    <rect x="28" y="52" width="8" height="8" rx="2"/>
    <rect x="4" y="28" width="8" height="8" rx="2"/>
    <rect x="52" y="28" width="8" height="8" rx="2"/>
  </g>
  <rect x="22" y="22" width="20" height="20" rx="4" fill="#C2A36B"/>
  <rect x="24.5" y="24.5" width="15" height="15" rx="2.5" fill="none" stroke="#8A7142" stroke-width="1.2"/>
</svg>
