[package]
name = "tessera"
version = "0.1.0"
description = "Tessera — BYOK AI roleplay client"
authors = ["Tessera"]
edition = "2024"
# Tauri 2.12's own MSRV. A lower value here would be a lie — cargo enforces the
# dependency's rust-version too, so the build needs 1.90 regardless.
rust-version = "1.90"

# The desktop shell is a thin webview around the same `dist/` bundle the Worker serves.
# There is no Rust business logic here on purpose: the prompt assembler, the SSE parser,
# and every provider quirk live in TypeScript, where the browser and the Worker can share
# them. Porting any of that to Rust would create a second implementation to keep in sync.
#
# Deliberately absent: tauri-plugin-http. Its `fetch` reads the response body to
# completion in Rust before the first chunk crosses the IPC boundary, so SSE never
# streams — https://github.com/tauri-apps/plugins-workspace/issues/2415 (duplicate
# #2129). The webview's own `fetch` streams correctly and is what the app uses; see
# src/lib/native/sse.ts.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
