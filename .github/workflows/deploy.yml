name: Deploy

# Runs the full check suite, then deploys. A commit that fails a test never reaches
# production — which is the only reason auto-deploy is safe to have at all.
on:
  push:
    branches: [main]
  # So a broken deploy can be retried without pushing an empty commit.
  workflow_dispatch:

concurrency:
  # A second push while the first is still deploying cancels the first. Without this,
  # two deploys race and the older one can win.
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc -b

      - name: Typecheck tests
        run: bunx tsc -p tsconfig.test.json --noEmit

      - name: Test
        run: bun test

      - name: Lint
        # `server` is the self-hosted entry point; it is linted with the rest rather than
        # left out of CI because it is newer than the other two.
        run: bunx oxlint src worker server

  # Required repo secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY.
  # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID can be deleted once D1 is retired.
  deploy:
    name: Deploy
    needs: check
    runs-on: ubuntu-latest
    # Exposed as env so the run steps read $VPS_HOST/$VPS_USER without nested
    # ${{ }} expressions inside quotes.
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        # `build` typechecks and builds for the browser and produces dist/, which the
        # deploy copies to the VPS. The server process there serves it statically.
        run: bun run build

      - name: Set up SSH
        run: |
          sudo apt-get update && sudo apt-get install -y openssh-client rsync
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Echoed because a typo here is invisible and the failure is misleading: sshd
          # reports "Invalid user tessera_deploy" in ITS log, while the runner only says
          # "Permission denied (publickey,password)" — which reads as a key problem. An
          # underscore where the account has a hyphen costs an hour.
          echo "target: $VPS_USER@$VPS_HOST"
          if ! printf '%s' "$VPS_USER" | grep -qE '^[a-z_][a-z0-9_-]*$'; then
            echo "::error::VPS_USER contains characters no Linux account name uses"
            exit 1
          fi

          # The key is printed as a FINGERPRINT, never as material. When the deploy fails
          # with "Permission denied (publickey)", the two candidates are a secret that
          # does not match the installed key and a secret that will not parse — and the
          # runner cannot tell you which, because both look identical from there. This
          # line makes the first case answerable: compare it against
          #   ssh-keygen -lf ~/.ssh/tessera_deploy
          # on the machine holding the key (or `ssh-keygen -lf` the key in CI's env).
          echo "key fingerprint: $(ssh-keygen -lf ~/.ssh/id_ed25519 | awk '{print $2}')"
          echo "key type/length: $(ssh-keygen -lf ~/.ssh/id_ed25519 | awk '{print $1, $4}')"
          echo "private key has CR: $(grep -c $'\r' ~/.ssh/id_ed25519 || true)"
          echo "line count: $(wc -l < ~/.ssh/id_ed25519)"

          # Host key is pinned from the live server so a later MITM cannot silently
          # harvest the deploy key.
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # Proves authentication on its own line, so a later rsync failure is clearly
          # not an SSH problem.
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" 'echo SSH-OK: authenticated as $(whoami)'

      - name: Copy to the server
        # `--exclude data` is load-bearing: the live SQLite database and its WAL files
        # live in /srv/tessera/data, and a deploy that overwrote them would destroy the
        # app's only copy.
        #
        # `dist/` is deliberately NOT excluded. It is the built SPA and the server serves
        # it statically, so excluding it would deploy an API with no website in front of
        # it. It is gitignored but present in the runner's working tree, which is exactly
        # why it has to be copied rather than rebuilt on the server.
        #
        # `--omit-dir-times` is required, not cosmetic. `-a` implies `-t`, and setting a
        # timestamp on a path needs OWNERSHIP of it, not write permission. The tree is
        # owned by the `tessera` service user while CI authenticates as `tessera-deploy`,
        # so every pre-existing directory fails with "failed to set times ... Operation
        # not permitted" and rsync exits 23. The files are unaffected because CI creates
        # them itself. `-rltz` rather than `-a` keeps the same transfer semantics without
        # the ownership-dependent attribute.
        run: |
          # `.bun` joined the excludes for the same reason as `data`: the tree on the
          # server contains `/srv/tessera/.bun` — root's bun cache from an install run
          # as root — and the deploy user cannot delete it. `--delete` then failed on
          # every file inside it (exit 23) and the deploy died before the restart step.
          # The cache is a build artifact of `bun install`, which the next step reruns
          # anyway; syncing it has no value and deleting it is not this job's job.
          rsync -rltz --delete --omit-dir-times \
            --exclude '.git' --exclude 'node_modules' --exclude 'data' --exclude '.bun' \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
            ./ "$VPS_USER@$VPS_HOST:/srv/tessera/"

      - name: Install dependencies and restart the service
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" \
            'cd /srv/tessera && /usr/local/bin/bun install --frozen-lockfile --production && sudo systemctl restart tessera'

      - name: Verify the service is healthy
        # The runner cannot reach the VPS loopback, so the health probe runs there.
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" \
            'sleep 2 && systemctl is-active tessera && curl -fsS http://127.0.0.1:8787/api/health'
