<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      The address bar and the mobile status bar take this. One tag, rewritten by
      `applyTheme` whenever the theme changes: the app's theme can be forced opposite
      the OS, and a static OS-based value would frame it in a colour it never uses.
    -->
    <meta name="theme-color" content="#16130F" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="A personal roleplay client with a cache-stable prompt assembler, long-term memory, and world state."
    />
    <!-- Installable on a phone without an app store: the APK is the fuller option, but
         this is one tap from the browser. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tessera" />
    <title>Tessera</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
