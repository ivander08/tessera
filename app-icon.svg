<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    A tessera: one tile in a mosaic. The surrounding tiles are dimmed and partially
    cropped, so the lit tile reads as part of a larger picture rather than a lone
    square — which is the whole idea behind the app's name.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8d3b0"/>
      <stop offset="1" stop-color="#b98f5e"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="#14110f"/>

  <!-- Neighbouring tiles: present, but out of focus. -->
  <g fill="#2a241f">
    <rect x="112" y="112" width="320" height="320" rx="28"/>
    <rect x="592" y="112" width="320" height="320" rx="28"/>
    <rect x="112" y="592" width="320" height="320" rx="28"/>
    <rect x="592" y="592" width="320" height="320" rx="28"/>
    <rect x="452" y="72" width="120" height="120" rx="16"/>
    <rect x="452" y="832" width="120" height="120" rx="16"/>
    <rect x="72" y="452" width="120" height="120" rx="16"/>
    <rect x="832" y="452" width="120" height="120" rx="16"/>
  </g>

  <!-- The lit tile. -->
  <rect x="352" y="352" width="320" height="320" rx="34" fill="url(#tile)" filter="url(#glow)"/>

  <!-- An inset seam, so the tile reads as cut stone rather than a flat square. -->
  <rect x="378" y="378" width="268" height="268" rx="22" fill="none" stroke="#8a6636" stroke-opacity="0.5" stroke-width="6"/>
</svg>
