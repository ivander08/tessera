<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 64 64">
  <!--
    A tessera: one tile in a mosaic. Four neighbouring tiles sit dimmed and partially
    cropped, so the lit tile reads as part of a larger picture rather than a lone square —
    which is the whole idea behind the app's name.

    ## One logo, three files

    This, `public/favicon.svg` and `src/components/Mark.tsx` are the same drawing. They are
    separate files because an installer, a browser tab and a React tree each need a
    different form — but the geometry is identical, so the mark looks like itself wherever
    it appears. An earlier version of this file drew EIGHT neighbours with a smaller lit
    tile, which was legible at 1024px and a smudge at 18px; the icon and the in-app mark
    were visibly different logos.

    ## Why the background is here and not in the favicon

    An installer icon is a finished square — Windows and macOS put it on their own
    surfaces, and a transparent 1024px PNG would show the desktop through the mosaic. The
    favicon deliberately has NO background, because a browser tab bar supplies its own and
    a painted square reads as a box on a dark theme.

    `viewBox` is 64 rather than 1024 so the numbers match the other two files exactly and a
    change can be copied between them without rescaling by hand.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8D3B0" />
      <stop offset="1" stop-color="#B98F5E" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.1" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" fill="#14110F" />

  <!-- Neighbouring tiles: present, but out of focus. -->
  <g fill="#2A241F">
    <rect x="2" y="2" width="14" height="14" rx="2.5" />
    <rect x="48" y="2" width="14" height="14" rx="2.5" />
    <rect x="2" y="48" width="14" height="14" rx="2.5" />
    <rect x="48" y="48" width="14" height="14" rx="2.5" />
  </g>

  <!-- The lit tile. -->
  <rect x="18" y="18" width="28" height="28" rx="5.5" fill="url(#tile)" filter="url(#glow)" />

  <!-- An inset seam, so the tile reads as cut stone rather than a flat square. -->
  <rect
    x="21.5"
    y="21.5"
    width="21"
    height="21"
    rx="3.5"
    fill="none"
    stroke="#8A6636"
    stroke-opacity="0.5"
    stroke-width="1.7"
  />
</svg>
